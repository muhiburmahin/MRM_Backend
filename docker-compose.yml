# OPTIONAL local development database only. Not a production deployment file.
services:
  db:
    image: postgres:16-alpine
    container_name: mrm-dev-postgres
    environment:
      POSTGRES_USER: mrm_dev
      POSTGRES_PASSWORD: mrm_dev_password # local development only
      POSTGRES_DB: mrm_web
    ports:
      - '5432:5432'
    volumes:
      - mrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mrm_dev -d mrm_web']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mrm_pgdata:
